services:
  app:
    build: ./app
    # image: ${REGISTRY_HOST}/overwatch-app:v1.1.1
    env_file:
      - .env
    user: root
    environment:
      - KEY_PATH=/app/secrets/id_ecdsa
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_SSH_SKIP_HOST_KEY_CHECK=1
    volumes:
      - ${KEY_PATH}:/app/secrets/id_ecdsa
      - /var/run/docker.sock:/var/run/docker.sock
  frontend:
    build: ./overwatch-dashboard
    # image: ${REGISTRY_HOST}/overwatch-frontend:v1.1.1
    ports:
      - "80:80"
    depends_on:
      - app